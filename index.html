<!doctype html>
<html lang="ar" dir="rtl" class="is-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>محمد عماد — تصميم وتطوير المواقع</title>
  <meta name="description" content="أصمّم وأطوّر مواقع أنيقة وسريعة للشركات والمتاجر الإلكترونية والعلامات الشخصية.">
  <meta name="theme-color" content="#0B0D12">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Open Graph: the preview card shown on WhatsApp / Facebook / LinkedIn.
       After you publish the site, replace mohammed-emad.vercel.app with your real address (see README). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="محمد عماد">
  <meta property="og:title" content="محمد عماد — مصمّم ومطوّر مواقع">
  <meta property="og:description" content="مواقع تكسب ثقة عملائك من أول نظرة — للشركات والمتاجر الإلكترونية والعلامات الشخصية.">
  <meta property="og:url" content="https://mohammed-emad.vercel.app/">
  <meta property="og:image" content="https://mohammed-emad.vercel.app/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="محمد عماد — مصمّم ومطوّر مواقع">
  <meta property="og:locale" content="ar_EG">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts load in the background so a slow connection never blocks the page. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <noscript><style>html.is-loading body{opacity:1}.reveal{opacity:1;transform:none}</style></noscript>

  <script src="data/site.js"></script>
  <script>
    /* Set language + direction before first paint (no flash). */
    (function () {
      var d = document.documentElement, l = new URLSearchParams(location.search).get('lang'), s;
      try { s = localStorage.getItem('lang'); } catch (e) {}
      l = l || s || (window.SITE && SITE.defaultLang) || 'ar';
      l = l === 'en' ? 'en' : 'ar';
      d.lang = l; d.dir = l === 'ar' ? 'rtl' : 'ltr';
    })();
  </script>
</head>
<body data-page="home">
  <header id="site-header"></header>

  <main id="main">
    <!-- ============ HERO ============ -->
    <section class="hero" id="top">
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__grid"></div>
        <div class="hero__glow"></div>
      </div>
      <div class="container hero__inner">
        <p class="status reveal" id="hero-status"><span class="status__dot"></span><span data-i18n="hero.status"></span></p>
        <h1 class="hero__title reveal" style="--d:.06s" data-i18n="hero.title"></h1>
        <p class="hero__lead reveal" style="--d:.12s" data-i18n="hero.lead"></p>
        <div class="hero__ctas reveal" style="--d:.18s">
          <a class="btn btn--ghost btn--lg" href="#work"><span data-i18n="hero.cta1"></span><span data-icon="arrow"></span></a>
          <a class="btn btn--primary btn--lg" data-wa><span data-icon="whatsapp"></span><span data-i18n="hero.cta2"></span></a>
        </div>
        <a class="consult-pill reveal" style="--d:.22s" data-wa="consult">
          <span class="consult-pill__tag" data-i18n="hero.consultTag"></span>
          <span class="consult-pill__text" data-i18n="hero.consultText"></span>
          <span class="consult-pill__cta"><span data-icon="calendar"></span><span data-i18n="consult.cta"></span><span data-icon="arrow"></span></span>
        </a>
      </div>
      <div class="container">
        <ul class="pillars reveal" style="--d:.26s" id="pillars"></ul>
      </div>
    </section>

    <!-- ============ WORK ============ -->
    <section class="section" id="work">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-i18n="work.eyebrow"></p>
          <h2 class="h2" data-i18n="work.title"></h2>
          <p class="lead" data-i18n="work.lead"></p>
        </header>
        <div class="work-grid" id="work-grid"></div>
      </div>
    </section>

    <!-- ============ WHY A WEBSITE ============ -->
    <section class="section section--tight-top" id="why">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-i18n="why.eyebrow"></p>
          <h2 class="h2" data-i18n="why.title"></h2>
          <p class="lead" data-i18n="why.lead"></p>
        </header>
        <div class="why-grid" id="why-grid"></div>
        <div class="why-cta reveal">
          <div>
            <h3 data-i18n="why.ctaTitle"></h3>
            <p data-i18n="why.ctaText"></p>
          </div>
          <a class="btn btn--primary btn--lg" data-wa="consult"><span data-icon="calendar"></span><span data-i18n="consult.cta"></span></a>
        </div>
      </div>
    </section>

    <!-- ============ AUTOMATION ============ -->
    <section class="section section--auto" id="automation">
      <div class="auto-bg" aria-hidden="true"></div>
      <div class="container">
        <header class="section-head section-head--center reveal">
          <p class="eyebrow eyebrow--center" data-i18n="auto.eyebrow"></p>
          <h2 class="h2 auto-title" data-i18n="auto.title"></h2>
          <p class="lead" data-i18n="auto.lead"></p>
        </header>
        <div class="flow-panel reveal">
          <p class="flow-panel__label" data-i18n="auto.flowTitle"></p>
          <div id="auto-flow"></div>
        </div>
        <div class="auto-grid" id="auto-grid"></div>
        <div class="auto-ctas reveal">
          <a class="btn btn--primary btn--lg" data-wa="consult"><span data-icon="calendar"></span><span data-i18n="consult.cta"></span></a>
          <a class="btn btn--ghost btn--lg" href="automation.html"><span data-i18n="auto.more"></span><span data-icon="arrow"></span></a>
        </div>
      </div>
    </section>

    <!-- ============ SERVICES ============ -->
    <section class="section" id="services">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-i18n="services.eyebrow"></p>
          <h2 class="h2" data-i18n="services.title"></h2>
          <p class="lead" data-i18n="services.lead"></p>
        </header>
        <div class="services-grid" id="services-grid"></div>
      </div>
    </section>

    <!-- ============ PROCESS (light section) ============ -->
    <section class="section section--light" id="process">
      <div class="container">
        <header class="section-head section-head--split reveal">
          <p class="eyebrow" data-i18n="process.eyebrow"></p>
          <h2 class="h2" data-i18n="process.title"></h2>
        </header>
        <ol class="steps" id="process-steps"></ol>
      </div>
    </section>

    <!-- ============ FREE CONSULTATION ============ -->
    <section class="section" id="consultation">
      <div class="container">
        <div class="consult reveal">
          <div class="consult__glow" aria-hidden="true"></div>
          <div class="consult__intro">
            <p class="eyebrow" data-i18n="consult.eyebrow"></p>
            <h2 class="h2" data-i18n="consult.title"></h2>
            <p class="lead" data-i18n="consult.lead"></p>
            <ul class="chips" id="consult-chips"></ul>
            <p class="consult__tasks"><span data-icon="bulb"></span><span data-i18n="consult.tasks"></span></p>
            <div class="consult__ctas">
              <a class="btn btn--primary btn--lg" data-wa="consult"><span data-icon="calendar"></span><span data-i18n="consult.cta"></span></a>
              <a class="btn btn--ghost btn--lg" href="consultation.html"><span data-i18n="consult.more"></span><span data-icon="arrow"></span></a>
            </div>
          </div>
          <ol class="consult__points" id="consult-points"></ol>
        </div>
      </div>
    </section>

    <!-- ============ TESTIMONIALS ============ -->
    <section class="section section--tight-top" id="testimonials">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-i18n="reviews.eyebrow"></p>
          <h2 class="h2" data-i18n="reviews.title"></h2>
        </header>
        <div class="reviews" id="reviews-list"></div>
      </div>
    </section>

    <!-- ============ ABOUT ============ -->
    <section class="section section--tight-top" id="about">
      <div class="container about">
        <div class="about__aside reveal">
          <figure class="about__portrait" id="about-portrait"></figure>
        </div>
        <div class="about__main reveal" style="--d:.08s">
          <p class="eyebrow" data-i18n="about.eyebrow"></p>
          <h2 class="h2" data-i18n="about.title"></h2>
          <div class="about__roles" id="about-roles"></div>
          <p class="about__body" data-i18n="about.body"></p>
          <p class="about__auto"><span data-icon="bolt"></span><span data-i18n="about.automation"></span></p>
          <p class="about__body about__body--2" data-i18n="about.body2"></p>
          <ul class="principles" id="principles"></ul>
        </div>
      </div>
    </section>

    <!-- ============ CONTACT ============ -->
    <section class="section section--tight-top" id="contact">
      <div class="container">
        <div class="contact reveal">
          <div class="contact__glow" aria-hidden="true"></div>
          <p class="eyebrow eyebrow--center" data-i18n="contact.eyebrow"></p>
          <h2 class="contact__title" data-i18n="contact.title"></h2>
          <p class="contact__lead" data-i18n="contact.lead"></p>
          <div class="contact-cards" id="contact-cards"></div>
          <a class="contact__consult" data-wa="consult"><span data-icon="calendar"></span><span data-i18n="contact.consult"></span><span data-icon="arrow"></span></a>
          <div class="contact__links" id="contact-links"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/reviews.js"></script>
  <script src="js/core.js"></script>
  <script src="js/auto-ui.js"></script>
  <script src="js/reviews-ui.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
