<!doctype html>
<html><head><meta charset="utf-8"><title>Profile picture — logo (1080×1080)</title>
<link rel="stylesheet" href="social.css">
<style>
  :root { --w: 1080px; --h: 1080px; }
  /* Everything important stays inside the center 70% so a circle crop never cuts it. */
  .halo { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; transform: translate(-50%, -50%); border-radius: 50%;
          background: radial-gradient(closest-side, rgba(46, 91, 255, .30), rgba(46, 91, 255, .08) 60%, transparent); }
  .ring { position: absolute; left: 50%; top: 50%; width: 740px; height: 740px; transform: translate(-50%, -50%); border-radius: 50%;
          border: 3px solid rgba(46, 91, 255, .45); box-shadow: 0 0 60px rgba(46, 91, 255, .25), inset 0 0 60px rgba(46, 91, 255, .12); }
  .mark { position: absolute; left: 50%; top: 50%; width: 470px; transform: translate(-50%, -50%); }
</style></head>
<body>
  <div class="halo"></div>
  <div class="ring"></div>
  <svg class="mark" viewBox="4 4 32 24"><path class="fg" d="M4 28V4h4l8 11 8-11h4v24h-4V11l-8 11-8-11v17zM24 4h12v4H24zM24 24h12v4H24z"/><path class="ac" d="M30 14h5v4h-5z"/></svg>
</body></html>
