<!doctype html>
<html><head><meta charset="utf-8"><title>Instagram highlight cover (1080×1920)</title>
<link rel="stylesheet" href="social.css">
<style>
  :root { --w: 1080px; --h: 1920px; --g: 72px; }
  /* Instagram shows highlight covers as a circle cut from the center, so the icon sits dead center. */
  .disc { position: absolute; left: 50%; top: 50%; width: 620px; height: 620px; transform: translate(-50%, -50%); border-radius: 50%;
          background: radial-gradient(circle at 50% 35%, rgba(46, 91, 255, .38), rgba(46, 91, 255, .10) 60%, rgba(46, 91, 255, .04));
          border: 3px solid rgba(46, 91, 255, .5); box-shadow: 0 0 90px rgba(46, 91, 255, .25); }
  .icon { position: absolute; left: 50%; top: 50%; width: 270px; height: 270px; transform: translate(-50%, -50%); stroke: var(--ivory); }
  .icon .ac { stroke: var(--cobalt-2); }
</style></head>
<body>
  <div class="grid" style="-webkit-mask-image: radial-gradient(circle 520px at 50% 50%, #000 30%, transparent 80%)"></div>
  <div class="disc"></div>
  <svg class="icon" id="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></svg>
  <script>
    // ?icon=work | reviews | services | contact
    const ICONS = {
      work: '<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 9h18"/><circle cx="6" cy="6.8" r=".5" class="ac"/><circle cx="8" cy="6.8" r=".5" class="ac"/><path d="M7 13h6M7 16h4" class="ac"/>',
      reviews: '<path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/><path d="M9.6 11.2h4.8" class="ac"/>',
      services: '<path d="M12 3 3 7.5l9 4.5 9-4.5z"/><path d="m3 12 9 4.5 9-4.5" class="ac"/><path d="m3 16.5 9 4.5 9-4.5"/>',
      contact: '<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.1A8 8 0 1 1 20 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01" class="ac" stroke-width="2.4"/>'
    };
    const key = new URLSearchParams(location.search).get('icon') || 'work';
    document.getElementById('icon').innerHTML = ICONS[key] || ICONS.work;
  </script>
</body></html>
