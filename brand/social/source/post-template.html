<!doctype html>
<html><head><meta charset="utf-8"><title>Post template (1080×1350)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=block">
<link rel="stylesheet" href="social.css">
<style>
  :root { --w: 1080px; --h: 1350px; --g: 72px; }
  /* Options: ?lang=ar for the Arabic layout, ?blank=1 for an empty background (add your own text in Canva). */
  .frame { position: absolute; inset: 72px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top img { height: 30px; display: block; }
  .tag { display: inline-flex; align-items: center; gap: 10px; font: 500 20px/1 "Inter", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--mist); }
  .tag::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--cobalt); }
  .content { margin-top: auto; margin-bottom: auto; }
  .content h1 { font-family: "Space Grotesk", sans-serif; font-weight: 500; font-size: 88px; line-height: 1.04; letter-spacing: -0.04em; }
  .content h1 span { color: var(--slate); }
  .content p { margin-top: 36px; font-size: 32px; line-height: 1.5; color: var(--mist); max-width: 24ch; }
  .bottom { display: flex; align-items: center; justify-content: space-between; padding-top: 32px; border-top: 1px solid rgba(244, 241, 234, .12); }
  .cta { display: inline-flex; align-items: center; gap: 12px; height: 60px; padding: 0 28px; border-radius: 999px; background: var(--cobalt); font: 500 22px/1 "Inter", sans-serif; box-shadow: 0 16px 40px -14px rgba(46, 91, 255, .8); }
  .site { font: 400 20px/1 "Inter", sans-serif; color: var(--slate); }
  /* Arabic */
  body.is-ar .frame { direction: rtl; }
  body.is-ar .tag { font-family: "IBM Plex Sans Arabic", sans-serif; letter-spacing: 0; font-size: 22px; }
  body.is-ar .content h1 { font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 600; letter-spacing: 0; line-height: 1.3; font-size: 84px; }
  body.is-ar .content p { font-family: "IBM Plex Sans Arabic", sans-serif; line-height: 1.75; font-size: 32px; }
  body.is-ar .cta { font-family: "IBM Plex Sans Arabic", sans-serif; font-size: 24px; }
  body.is-blank .tag, body.is-blank .content { visibility: hidden; }
</style></head>
<body>
  <div class="grid" style="-webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 10%, transparent 70%)"></div>
  <div class="glow" style="width:1200px;height:800px;top:-520px"></div>
  <div class="frame">
    <div class="top"><img src="../logo/logo-dark.svg" alt=""><span class="tag" id="tag">Website tip</span></div>
    <div class="content">
      <h1 id="title">Your website should make one thing clear: <span>why you.</span></h1>
      <p id="body">Lead with what you do, who it’s for, and how to reach you.</p>
    </div>
    <div class="bottom">
      <span class="cta" id="cta">Book a free consultation</span>
      <span class="site">mohammed-emad-portfolio.vercel.app</span>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('lang') === 'ar') {
      document.body.classList.add('is-ar');
      document.getElementById('tag').textContent = 'نصيحة للمواقع';
      document.getElementById('title').innerHTML = 'يجب أن يوضّح موقعك شيئًا واحدًا: <span>لماذا أنت؟</span>';
      document.getElementById('body').textContent = 'ابدأ بما تقدّمه، ولمن تقدّمه، وكيف يتواصل معك العميل.';
      document.getElementById('cta').textContent = 'احجز استشارة مجانية';
    }
    if (q.get('blank') === '1') document.body.classList.add('is-blank');
  </script>
</body></html>
