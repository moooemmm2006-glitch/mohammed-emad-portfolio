<!doctype html>
<html><head><meta charset="utf-8"><title>Facebook cover — ME Web (1640×624)</title>
<!-- cover-facebook.html?v=dark (default) or ?v=light -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=block">
<link rel="stylesheet" href="social.css">
<style>
  :root { --w: 1640px; --h: 624px; --g: 60px; }
  /* Safe area: centered 1100×440 — visible on mobile (sides get cropped) and clear of the
     profile picture that overlaps the bottom-left corner on desktop. */
  .safe { position: absolute; left: 270px; top: 92px; width: 1100px; height: 440px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .brandline { display: flex; align-items: center; gap: 26px; margin-bottom: 46px; }
  .mark { width: 88px; }
  .brandline b { font: 500 60px/1 "Space Grotesk", sans-serif; letter-spacing: .08em; margin-right: -.08em; }
  .names { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 44px; width: 100%; }
  .divider { width: 1px; height: 150px; background: linear-gradient(transparent, rgba(244, 241, 234, .22), transparent); }
  .side h2 { font-size: 40px; line-height: 1.2; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; }
  /* Both names hug the center divider. */
  .en { text-align: right; }
  .en h2 { font-family: "Space Grotesk", sans-serif; }
  .ar { text-align: left; }
  .ar h2 { font-weight: 500; letter-spacing: 0; line-height: 1.45; font-size: 40px; }
  .divider { height: 120px; }
  .link { margin-top: 44px; display: inline-flex; align-items: center; gap: 12px; height: 52px; padding: 0 24px; border-radius: 999px;
          border: 1.5px solid rgba(46, 91, 255, .55); background: rgba(46, 91, 255, .14); font: 500 21px/1 "Inter", sans-serif; color: var(--ivory); }
  .link svg { width: 22px; height: 22px; stroke: var(--cobalt-2); }

  /* Light version */
  .light, .light body { background: var(--ivory); color: var(--ink); --line: rgba(11, 13, 18, .07); }
  .light .mark .fg { fill: var(--ink); }
  .light .glow { background: radial-gradient(closest-side, rgba(46, 91, 255, .16), rgba(46, 91, 255, .05) 55%, transparent); }
  .light .divider { background: linear-gradient(transparent, rgba(11, 13, 18, .2), transparent); }
  .light .link { color: var(--ink); background: rgba(46, 91, 255, .08); border-color: rgba(46, 91, 255, .45); }
  .light .link svg { stroke: var(--cobalt); }
</style>
<script>if (new URLSearchParams(location.search).get('v') === 'light') document.documentElement.className = 'light';</script></head>
<body>
  <div class="grid"></div>
  <div class="glow" style="width:1500px;height:760px;bottom:-520px"></div>
  <div class="glow" style="width:900px;height:500px;top:-360px;opacity:.6"></div>
  <div class="safe">
    <div class="brandline">
      <svg class="mark" viewBox="4 4 32 24"><path class="fg" d="M4 28V4h4l8 11 8-11h4v24h-4V11l-8 11-8-11v17zM24 4h12v4H24zM24 24h12v4H24z"/><path class="ac" d="M30 14h5v4h-5z"/></svg>
      <b>ME WEB</b>
    </div>
    <div class="names">
      <div class="side en"><h2>Websites &amp; automations<br>that bring you clients</h2></div>
      <div class="divider"></div>
      <div class="side ar"><h2>مواقع وأتمتة<br>تجلب لك العملاء</h2></div>
    </div>
    <!-- Website link: change the text below if your address is different. -->
    <div class="link"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>me-web.vercel.app</span></div>
  </div>
</body></html>
